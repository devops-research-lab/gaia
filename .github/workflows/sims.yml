name: Sims
on:
  push: null
jobs:
  cleanup-runs:
    runs-on: Gaia-Runner-medium
    steps:
    - uses: rokroskar/workflow-run-cleanup-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    if: '!startsWith(github.ref, ''refs/tags/'') && github.ref != ''refs/heads/main'''
  build:
    runs-on: Gaia-Runner-medium
    steps:
    - name: stepify-probe-build
      run: echo stepify-probe-build
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: 1.23.x
    - name: Install runsim
      run: go install github.com/cosmos/tools/cmd/runsim@v1.0.0
    - uses: actions/cache@v4
      with:
        path: ~/go/bin
        key: ${{ runner.os }}-go-runsim-binary-${{ hashFiles('**/go.sum') }}
        restore-keys: '${{ runner.os }}-go-runsim-binary-

          '
    - name: stepify-tail-build
      run: echo stepify-tail-build
    - name: stepify-probe-test-sim-nondeterminism
      run: echo stepify-probe-test-sim-nondeterminism
    - uses: technote-space/get-diff-action@v6.0.1
      with:
        PATTERNS: '**/**.go

          go.mod

          go.sum

          '
    - uses: actions/cache@v4.2.0
      with:
        path: ~/go/bin
        key: ${{ runner.os }}-go-runsim-binary
      if: env.GIT_DIFF != ''
    - name: test nondeterminism
      run: 'make test-sim-nondeterminism

        '
      if: env.GIT_DIFF != ''
    - name: stepify-tail-test-sim-nondeterminism
      run: echo stepify-tail-test-sim-nondeterminism
    - name: stepify-probe-test-sim-multi-seed-short
      run: echo stepify-probe-test-sim-multi-seed-short
    - uses: technote-space/get-diff-action@v6
      with:
        PATTERNS: '**/**.go

          go.mod

          go.sum

          '
    - name: test-sim-multi-seed-short
      run: 'make test-sim-multi-seed-short

        '
      if: env.GIT_DIFF != ''
    - name: stepify-tail-test-sim-multi-seed-short
      run: echo stepify-tail-test-sim-multi-seed-short
    - name: stepify-probe-test-sim-multi-seed-long
      run: echo stepify-probe-test-sim-multi-seed-long
    - name: stepify-fault-test-sim-multi-seed-long
      run: exit 1
    - name: test-sim-multi-seed-long
      run: 'make test-sim-multi-seed-long

        '
      if: env.GIT_DIFF != ''
    - name: stepify-tail-test-sim-multi-seed-long
      run: echo stepify-tail-test-sim-multi-seed-long
